<svg xmlns="http://www.w3.org/2000/svg" width="860" height="160" viewBox="0 0 860 160" role="img">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1a2337"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="860" height="160" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="858" height="158" rx="15" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- decorative request/response lines -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11" opacity="0.35">
    <text x="700" y="34" fill="#22c55e">GET /echo/hi HTTP/1.1</text>
    <text x="684" y="78" fill="#38bdf8">HTTP/1.1 200 OK</text>
  </g>

  <!-- title -->
  <text x="36" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">Build Your Own HTTP Server</text>
  <text x="36" y="76" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#94a3b8">$ bun run app/main.ts &#183; TypeScript &#183; Stage 4/8</text>

  <!-- progress bar -->
  <rect x="36" y="96" width="788" height="20" rx="10" fill="#1e293b" stroke="#334155"/>
  <rect x="36" y="96" width="394" height="20" rx="10" fill="url(#bar)" filter="url(#glow)"/>
  <text x="233" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Stage 4 / 8</text>

  <!-- stage dots -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12">
    <circle cx="46" cy="136" r="6" fill="#22c55e"/><text x="60" y="140" fill="#e2e8f0">&#10003; port</text>
    <circle cx="150" cy="136" r="6" fill="#22c55e"/><text x="164" y="140" fill="#e2e8f0">&#10003; routing</text>
    <circle cx="266" cy="136" r="6" fill="#22c55e"/><text x="280" y="140" fill="#e2e8f0">&#10003; echo/body</text>
    <circle cx="404" cy="136" r="6" fill="#22c55e"/><text x="418" y="140" fill="#e2e8f0">&#10003; headers</text>
    <circle cx="530" cy="136" r="6" fill="#1e293b" stroke="#475569"/><text x="544" y="140" fill="#64748b">concurrency</text>
    <circle cx="672" cy="136" r="6" fill="#1e293b" stroke="#475569"/><text x="686" y="140" fill="#64748b">files</text>
    <circle cx="776" cy="136" r="6" fill="#1e293b" stroke="#475569"/><text x="790" y="140" fill="#64748b">gzip</text>
  </g>
</svg>
