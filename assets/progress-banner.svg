<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#1a2337"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="860" height="200" rx="16" fill="url(#bg)"/>
  <rect width="860" height="200" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="858" height="198" rx="15" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- header -->
  <text x="36" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="27" font-weight="700" fill="#f1f5f9">Build Your Own <tspan fill="#4ade80">HTTP Server</tspan></text>
  <text x="36" y="90" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#94a3b8"><tspan fill="#38bdf8">$</tspan> bun run app/main.ts &#183; TypeScript &#183; node:net</text>

  <!-- stat -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" text-anchor="end">
    <text x="824" y="52" font-size="14" fill="#64748b">PROGRESS</text>
    <text x="824" y="88" font-size="34" font-weight="700" fill="#4ade80">40%</text>
  </g>
  <line x1="700" y1="104" x2="824" y2="104" stroke="#334155" stroke-width="1"/>

  <!-- stage segments -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="600" text-anchor="middle">
    <!-- done -->
    <rect x="36" y="128" width="72" height="32" rx="8" fill="url(#bar)" filter="url(#glow)"/>
    <text x="72" y="149" fill="#052e16">&#10003;</text>
    <rect x="115" y="128" width="72" height="32" rx="8" fill="url(#bar)" filter="url(#glow)"/>
    <text x="151" y="149" fill="#052e16">&#10003;</text>
    <rect x="194" y="128" width="72" height="32" rx="8" fill="url(#bar)" filter="url(#glow)"/>
    <text x="230" y="149" fill="#052e16">&#10003;</text>
    <rect x="273" y="128" width="72" height="32" rx="8" fill="url(#bar)" filter="url(#glow)"/>
    <text x="309" y="149" fill="#052e16">&#10003;</text>
    <!-- pending -->
    <rect x="352" y="128" width="72" height="32" rx="8" fill="#16213a" stroke="#334155"/>
    <text x="388" y="149" fill="#475569">05</text>
    <rect x="431" y="128" width="72" height="32" rx="8" fill="#16213a" stroke="#334155"/>
    <text x="467" y="149" fill="#475569">06</text>
    <rect x="510" y="128" width="72" height="32" rx="8" fill="#16213a" stroke="#334155"/>
    <text x="546" y="149" fill="#475569">07</text>
    <rect x="589" y="128" width="72" height="32" rx="8" fill="#16213a" stroke="#334155"/>
    <text x="625" y="149" fill="#475569">08</text>
    <rect x="668" y="128" width="72" height="32" rx="8" fill="#16213a" stroke="#334155"/>
    <text x="704" y="149" fill="#475569">09</text>
    <rect x="747" y="128" width="72" height="32" rx="8" fill="#16213a" stroke="#334155"/>
    <text x="783" y="149" fill="#475569">10</text>
  </g>

  <!-- stage legend -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11" fill="#64748b">
    <text x="36" y="182">port &#183; 200 &#183; path &#183; body</text>
    <text x="824" y="182" text-anchor="end">header &#183; concurrent &#183; file &#183; req-body &#183; compress &#183; persist</text>
  </g>
</svg>
