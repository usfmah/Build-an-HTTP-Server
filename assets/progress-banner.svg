<svg xmlns="http://www.w3.org/2000/svg" width="860" height="160" viewBox="0 0 860 160" role="img">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1a2337"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="860" height="160" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="858" height="158" rx="15" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- decorative request/response lines -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="11" opacity="0.35">
    <text x="700" y="34" fill="#22c55e">GET /echo/hi HTTP/1.1</text>
    <text x="684" y="78" fill="#38bdf8">HTTP/1.1 200 OK</text>
  </g>

  <!-- title -->
  <text x="36" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9">Build Your Own HTTP Server</text>
  <text x="36" y="76" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#94a3b8">$ bun run app/main.ts &#183; TypeScript &#183; Stage 1/7</text>

  <!-- progress bar -->
  <rect x="36" y="96" width="788" height="20" rx="10" fill="#1e293b" stroke="#334155"/>
  <rect x="36" y="96" width="118" height="20" rx="10" fill="url(#bar)" filter="url(#glow)"/>
  <text x="95" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Stage 1 / 7</text>

  <!-- stage dots -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="12">
    <circle cx="46" cy="136" r="6" fill="#22c55e"/><text x="60" y="140" fill="#e2e8f0">&#10003; body</text>
    <circle cx="146" cy="136" r="6" fill="#1e293b" stroke="#475569"/><text x="160" y="140" fill="#64748b">header</text>
    <circle cx="254" cy="136" r="6" fill="#1e293b" stroke="#475569"/><text x="268" y="140" fill="#64748b">concurrent</text>
    <circle cx="388" cy="136" r="6" fill="#1e293b" stroke="#475569"/><text x="402" y="140" fill="#64748b">file</text>
    <circle cx="462" cy="136" r="6" fill="#1e293b" stroke="#475569"/><text x="476" y="140" fill="#64748b">req-body</text>
    <circle cx="584" cy="136" r="6" fill="#1e293b" stroke="#475569"/><text x="598" y="140" fill="#64748b">compression</text>
    <circle cx="730" cy="136" r="6" fill="#1e293b" stroke="#475569"/><text x="744" y="140" fill="#64748b">persistent</text>
  </g>
</svg>
